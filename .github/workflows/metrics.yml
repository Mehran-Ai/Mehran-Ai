name: Metrics & History Graph
on:
  schedule: [{cron: "0 */4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  # 1. Collect Data & Generate Traffic Graph
  traffic-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      # A. Collect Traffic Data to CSV
      - name: Repository Traffic Collector
        uses: sangonzal/repository-traffic-action@master
        env:
          # Using the secret name you confirmed
          TRAFFIC_ACTION_TOKEN: ${{ secrets.METRICS_PROFILE }}

      # B. Generate Graph from CSV (Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate Traffic Graph
        run: |
          cat << 'EOF' > plot_traffic.py
          import pandas as pd
          import matplotlib.pyplot as plt
          import os

          # Define path
          csv_path = "traffic/views.csv"

          # 1. Check if file exists
          if not os.path.exists(csv_path):
              print(f"File {csv_path} not found. Skipping graph generation.")
              # Generate placeholder
              plt.figure(figsize=(10, 5))
              plt.text(0.5, 0.5, 'Waiting for data...', ha='center', color='white')
              plt.axis('off')
              plt.savefig("traffic-graph.svg", transparent=True)
              exit(0)

          # 2. Read CSV & Detect Columns
          try:
              df = pd.read_csv(csv_path)
              
              # Normalize column names (lowercase, strip whitespace)
              df.columns = [c.lower().strip() for c in df.columns]
              print(f"Found columns: {df.columns.tolist()}")

              # Smart column detection
              date_col = df.columns[0] # Assume first col is date
              
              # Find 'count' or 'views' column
              count_col = next((c for c in df.columns if 'count' in c or 'view' in c), None)
              
              # Find 'unique' column
              unique_col = next((c for c in df.columns if 'unique' in c), None)

              if not count_col or not unique_col:
                  print("Error: Could not identify count or unique columns.")
                  exit(0)

              # Convert date
              df[date_col] = pd.to_datetime(df[date_col])
              df = df.sort_values(date_col)

          except Exception as e:
              print(f"Error processing CSV: {e}")
              exit(0)

          # 3. Plotting
          plt.figure(figsize=(10, 5))
          
          # Plot Total Views
          plt.plot(df[date_col], df[count_col], marker='o', linestyle='-', color='#79ff97', linewidth=2, label='Total Views')
          
          # Plot Unique Visitors
          plt.plot(df[date_col], df[unique_col], marker='o', linestyle='--', color='#2f80ed', linewidth=2, label='Unique Visitors')
          
          # Style
          plt.style.use('dark_background')
          plt.gca().spines['top'].set_visible(False)
          plt.gca().spines['right'].set_visible(False)
          plt.gca().spines['bottom'].set_color('#30363d')
          plt.gca().spines['left'].set_color('#30363d')
          
          plt.title('Repository Views History', color='white', fontweight='bold', pad=20)
          plt.xlabel('Date', color='#8b949e')
          plt.ylabel('Views', color='#8b949e')
          plt.tick_params(colors='#8b949e')
          plt.grid(True, linestyle=':', alpha=0.2, color='white')
          plt.legend(frameon=False, labelcolor='white')
          plt.tight_layout()

          # Save
          plt.savefig("traffic-graph.svg", transparent=True)
          print("Graph generated successfully: traffic-graph.svg")
          EOF
          
          python plot_traffic.py

      # C. Commit changes
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic history and graph"
          file_pattern: "traffic/ traffic-graph.svg"

  # 2. Generate Standard Metrics
  github-metrics:
    needs: traffic-history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # FIXED: Using your secret name
          token: ${{ secrets.METRICS_PROFILE }}
          
          # Options
          user: Mehran-Ai
          template: classic
          config_timezone: Asia/Tehran
          base: header, activity, repositories
          config_display: large
          # REMOVED: "theme" input (invalid). We will stick to default dark mode or use extras_css if needed.
          
          # Plugins
          plugin_traffic: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
