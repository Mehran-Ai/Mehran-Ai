name: Metrics
on:
  # Schedule updates (runs every 4 hours)
  schedule: [{cron: "0 */4 * * *"}]
  # Run manually from Actions tab
  workflow_dispatch:
  # Run on push to main branch only
  push: {branches: ["main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_PROFILE }}

          user: Mehran-Ai
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tehran
          
          # --- THEME & APPEARANCE --- 
          # Change these to test different looks!
          config_display: large
          theme: tokyonight 
          
          # --- PLUGINS --- 

          # 1. 3D Calendar 
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # 2. Languages 
          plugin_languages: yes
          plugin_languages_ignored: >-
            html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell,
            gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage

          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base

          # plugin_stackoverflow: yes
          # plugin_stackoverflow_user: 
          # plugin_stackoverflow_sections: answers-top, questions-recent
          # plugin_stackoverflow_limit: 2
          
          # plugin_kaggle: yes
          # plugin_kaggle_user: 
          # plugin_kaggle_sections: competitions, master
