name: Metrics & History Graph
on:
  schedule: [{cron: "0 */4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  # 1. Collect Data & Generate Traffic Graph
  traffic-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Retrieve full history

      # A. Collect Traffic Data to CSV
      - name: Repository Traffic Collector
        # CHANGED: Switched to @master to fix the version error
        uses: sangonzal/repository-traffic-action@master
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.METRICS_PROFILE }}

      # B. Generate Graph from CSV (Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate Traffic Graph
        run: |
          cat << 'EOF' > plot_traffic.py
          import pandas as pd
          import matplotlib.pyplot as plt
          import os

          # Define the path to the traffic views file
          # The action saves it in the 'traffic' folder
          csv_path = "traffic/views.csv"

          # Check if file exists (it might not on the very first run)
          if not os.path.exists(csv_path):
              print(f"File {csv_path} not found. Skipping graph generation for now.")
              # Create a placeholder empty image to prevent errors
              plt.figure(figsize=(10, 5))
              plt.text(0.5, 0.5, 'Collecting Data...', ha='center', color='white')
              plt.axis('off')
              plt.savefig("traffic-graph.svg", transparent=True)
              exit(0)

          # Read CSV
          try:
              df = pd.read_csv(csv_path, parse_dates=['_date'])
              df = df.sort_values('_date')
          except Exception as e:
              print(f"Error reading CSV: {e}")
              exit(0)

          # Plot setup
          plt.figure(figsize=(10, 5))
          
          # Plot Total Views
          plt.plot(df['_date'], df['count'], marker='o', linestyle='-', color='#79ff97', linewidth=2, label='Total Views')
          
          # Plot Unique Visitors
          plt.plot(df['_date'], df['uniques'], marker='o', linestyle='--', color='#2f80ed', linewidth=2, label='Unique Visitors')
          
          # Styling (Dark Theme)
          plt.style.use('dark_background')
          
          # Remove frame
          plt.gca().spines['top'].set_visible(False)
          plt.gca().spines['right'].set_visible(False)
          plt.gca().spines['bottom'].set_color('#30363d')
          plt.gca().spines['left'].set_color('#30363d')
          
          plt.title('Repository Views History', color='white', fontweight='bold', pad=20)
          plt.xlabel('Date', color='#8b949e')
          plt.ylabel('Count', color='#8b949e')
          plt.tick_params(colors='#8b949e')
          plt.grid(True, linestyle=':', alpha=0.2, color='white')
          plt.legend(frameon=False, labelcolor='white')
          plt.tight_layout()

          # Save
          plt.savefig("traffic-graph.svg", transparent=True)
          print("Graph generated successfully: traffic-graph.svg")
          EOF
          
          python plot_traffic.py

      # C. Commit both the CSV history AND the new graph
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic history and graph"
          # IMPORTANT: We commit the traffic folder (CSV) AND the SVG
          file_pattern: "traffic/ traffic-graph.svg"

  # 2. Generate Standard Metrics
  github-metrics:
    needs: traffic-history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mehran-Ai
          template: classic
          config_timezone: Asia/Tehran
          base: header, activity, repositories
          config_display: large
          theme: tokyonight 
          
          plugin_traffic: yes
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
