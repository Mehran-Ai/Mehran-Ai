name: Metrics & History Graph
on:
  schedule: [{cron: "0 */4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  # 1. Collect Data & Generate Traffic Graph
  traffic-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Retrieve full history for commits

      # A. Collect Traffic Data to CSV
      - name: Repository Traffic Collector
        uses: sangonzal/repository-traffic-action@v0.1.6
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.METRICS_TOKEN }}

      # B. Generate Graph from CSV (Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate Traffic Graph
        run: |
          cat << 'EOF' > plot_traffic.py
          import pandas as pd
          import matplotlib.pyplot as plt
          import os

          # Check if file exists
          if not os.path.exists("traffic/views.csv"):
              print("No traffic data found yet.")
              exit(0)

          # Read CSV
          df = pd.read_csv("traffic/views.csv", parse_dates=['_date'])
          df = df.sort_values('_date')

          # Plot
          plt.figure(figsize=(10, 5))
          plt.plot(df['_date'], df['count'], marker='o', linestyle='-', color='#79ff97', label='Total Views')
          plt.plot(df['_date'], df['uniques'], marker='o', linestyle='--', color='#2f80ed', label='Unique Visitors')
          
          # Style (Dark Mode for GitHub)
          plt.style.use('dark_background')
          plt.title('Repository Traffic History (All Time)', color='white')
          plt.xlabel('Date', color='white')
          plt.ylabel('Views', color='white')
          plt.grid(True, linestyle=':', alpha=0.3)
          plt.legend()
          plt.tight_layout()

          # Save
          plt.savefig("traffic-graph.svg", transparent=True)
          print("Graph generated: traffic-graph.svg")
          EOF
          
          python plot_traffic.py

      # C. Commit the new graph
      - name: Commit Graph
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic graph"
          file_pattern: "traffic-graph.svg"

  # 2. Generate Standard Metrics (Your existing setup)
  github-metrics:
    needs: traffic-history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mehran-Ai
          template: classic
          config_timezone: Asia/Tehran
          base: header, activity, repositories
          config_display: large
          theme: tokyonight 
          
          # Plugins
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
