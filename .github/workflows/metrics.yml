name: Metrics & History Graph
on:
  schedule: [{cron: "0 */4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  # 1. Collect Data & Generate Traffic Graph
  traffic-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      # A. Collect Traffic Data to CSV
      - name: Repository Traffic Collector
        uses: sangonzal/repository-traffic-action@master
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.METRICS_PROFILE }}

      # B. Generate Graph from CSV (Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate Traffic Graph
        run: |
          cat << 'EOF' > plot_traffic.py
          import pandas as pd
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          import os

          # Setup Plot
          plt.style.use('dark_background')
          fig = plt.figure(figsize=(10, 8)) # Taller to fit 2 charts

          def plot_data(ax, csv_path, title, color_total, color_unique):
              if not os.path.exists(csv_path):
                  ax.text(0.5, 0.5, f'{title}: No data yet', ha='center', va='center', color='white')
                  ax.axis('off')
                  return

              try:
                  df = pd.read_csv(csv_path)
                  # Normalize columns
                  df.columns = [c.lower().strip() for c in df.columns]
                  
                  # Detect columns
                  date_col = df.columns[0]
                  count_col = next((c for c in df.columns if 'count' in c or 'view' in c), None)
                  unique_col = next((c for c in df.columns if 'unique' in c), None)

                  if not count_col or not unique_col:
                      return

                  # Convert date
                  df[date_col] = pd.to_datetime(df[date_col])
                  df = df.sort_values(date_col)

                  # Plot Lines
                  ax.plot(df[date_col], df[count_col], marker='o', linestyle='-', color=color_total, linewidth=2, label='Total')
                  ax.plot(df[date_col], df[unique_col], marker='o', linestyle='--', color=color_unique, linewidth=2, label='Unique')
                  
                  # Styling
                  ax.set_title(title, color='white', fontweight='bold', loc='left', pad=10)
                  ax.grid(True, linestyle=':', alpha=0.2, color='white')
                  
                  # Remove borders
                  ax.spines['top'].set_visible(False)
                  ax.spines['right'].set_visible(False)
                  ax.spines['bottom'].set_color('#30363d')
                  ax.spines['left'].set_color('#30363d')
                  ax.tick_params(colors='#8b949e')
                  
                  # Format Date (e.g., Nov 29)
                  ax.xaxis.set_major_formatter(mdates.DateFormatter('%b %d'))
                  
                  # Legend placed OUTSIDE to the right
                  ax.legend(frameon=False, labelcolor='white', loc='center left', bbox_to_anchor=(1, 0.5))
                  
              except Exception as e:
                  print(f"Error plotting {title}: {e}")

          # 1. Plot Views (Top)
          ax1 = plt.subplot(2, 1, 1)
          plot_data(ax1, "traffic/views.csv", "Repository Views", "#79ff97", "#2f80ed") # Green & Blue

          # 2. Plot Clones (Bottom)
          ax2 = plt.subplot(2, 1, 2)
          plot_data(ax2, "traffic/clones.csv", "Repository Clones", "#ff7b72", "#d2a8ff") # Red & Purple

          plt.tight_layout()
          plt.savefig("traffic-graph.svg", transparent=True, bbox_inches="tight")
          print("Graph generated successfully.")
          EOF
          
          python plot_traffic.py

      # C. Commit changes
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic history and graph"
          file_pattern: "traffic/ traffic-graph.svg"

  # 2. Generate Standard Metrics
  github-metrics:
    needs: traffic-history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_PROFILE }}
          
          # Options
          user: Mehran-Ai
          template: classic
          config_timezone: Asia/Tehran
          base: header, activity, repositories
          config_display: large
          
          # Plugins
          plugin_traffic: yes
          
          # Habits & Charts
          plugin_habits: yes
          plugin_habits_from: 1000      # Use max events (1000)
          plugin_habits_days: 365       # Keep history for 1 year (or as far back as GitHub API allows)
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Followup (Radar Chart)
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes
          
          # Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          
          # Lines of Code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
