name: Metrics & History Graph
on:
  schedule: [{cron: "0 */4 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  # 1. Collect Data & Generate Traffic Graph
  traffic-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 

      # A. Collect Traffic Data to CSV
      - name: Repository Traffic Collector
        uses: sangonzal/repository-traffic-action@master
        env:
          TRAFFIC_ACTION_TOKEN: ${{ secrets.METRICS_PROFILE }}

      # B. Generate Graph from CSV (Python)
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          pip install pandas matplotlib

      - name: Generate Traffic Graph
        run: |
          cat << 'EOF' > plot_traffic.py
          import pandas as pd
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          import os

          # --- THEME SETUP (Tokyo Night) ---
          BG_COLOR = '#1a1b26' 
          TEXT_COLOR = '#a9b1d6'
          GRID_COLOR = '#414868'
          
          # Setup Plot
          plt.style.use('dark_background')
          fig = plt.figure(figsize=(10, 8))
          fig.patch.set_facecolor(BG_COLOR)

          def plot_data(ax, csv_path, title, color_total, color_unique):
              ax.set_facecolor(BG_COLOR)
              
              if not os.path.exists(csv_path) or os.stat(csv_path).st_size == 0:
                  ax.text(0.5, 0.5, f'{title}: No data recorded yet', 
                          ha='center', va='center', color=TEXT_COLOR, fontsize=12)
                  ax.axis('off')
                  return

              try:
                  df = pd.read_csv(csv_path)
                  df.columns = [c.lower().strip() for c in df.columns]
                  
                  # Verify we have data to plot
                  if df.empty:
                      ax.text(0.5, 0.5, f'{title}: Data is empty', 
                              ha='center', va='center', color=TEXT_COLOR)
                      ax.axis('off')
                      return

                  date_col = df.columns[0]
                  count_col = next((c for c in df.columns if 'count' in c or 'view' in c), None)
                  unique_col = next((c for c in df.columns if 'unique' in c), None)

                  if not count_col or not unique_col:
                      return

                  df[date_col] = pd.to_datetime(df[date_col])
                  df = df.sort_values(date_col)

                  # PLOT with Human-Readable Labels
                  ax.plot(df[date_col], df[count_col], marker='o', linestyle='-', 
                          color=color_total, linewidth=2, label='Total Count')
                  ax.plot(df[date_col], df[unique_col], marker='o', linestyle='--', 
                          color=color_unique, linewidth=2, label='Unique Visitors')
                  
                  # Styling
                  ax.set_title(title, color=TEXT_COLOR, fontweight='bold', loc='left', pad=10)
                  ax.grid(True, linestyle=':', alpha=0.4, color=GRID_COLOR)
                  
                  ax.spines['top'].set_visible(False)
                  ax.spines['right'].set_visible(False)
                  ax.spines['bottom'].set_color(GRID_COLOR)
                  ax.spines['left'].set_color(GRID_COLOR)
                  ax.tick_params(colors=TEXT_COLOR)
                  
                  ax.xaxis.set_major_formatter(mdates.DateFormatter('%b %d'))
                  
                  # ADD LEGEND (Explicitly colored text)
                  legend = ax.legend(frameon=False, loc='upper left', bbox_to_anchor=(1, 1))
                  plt.setp(legend.get_texts(), color=TEXT_COLOR)
                  
              except Exception as e:
                  print(f"Error plotting {title}: {e}")
                  ax.text(0.5, 0.5, f'Error loading {title}', ha='center', color='red')
                  ax.axis('off')

          # 1. Plot Views (Top)
          ax1 = plt.subplot(2, 1, 1)
          plot_data(ax1, "traffic/views.csv", "Repository Views", "#7aa2f7", "#bb9af7") 

          # 2. Plot Clones (Bottom)
          ax2 = plt.subplot(2, 1, 2)
          plot_data(ax2, "traffic/clones.csv", "Repository Clones", "#f7768e", "#e0af68") 

          plt.tight_layout()
          plt.savefig("traffic-graph.svg", facecolor=fig.get_facecolor(), edgecolor='none', bbox_inches="tight")
          print("Graph generated successfully.")
          EOF
          
          python plot_traffic.py

      # C. Commit changes
      - name: Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update traffic history and graph"
          file_pattern: "traffic/ traffic-graph.svg"

  # 2. Generate Standard Metrics
  github-metrics:
    needs: traffic-history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_PROFILE }}
          
          # Options
          user: Mehran-Ai
          template: classic
          config_timezone: Asia/Tehran
          base: header, activity, repositories
          config_display: large
          
          # Plugins
          plugin_traffic: yes
          
          # Habits (Reduced to 14 days to prevent error)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14        
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          
          # Introduction (Adds the "Radar" / Spider chart for activity)
          plugin_introduction: yes
          plugin_introduction_title: yes
          
          # Followup
          plugin_followup: yes
          plugin_followup_sections: repositories
          plugin_followup_indepth: yes
          
          # Languages
          plugin_languages: yes
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: lines, percentage
          
          # Lines of Code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
